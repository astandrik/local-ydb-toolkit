name: Release MCP server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run build, tests, typecheck, and npm package dry-run.
        required: false
        default: true
        type: boolean
      publish_tag:
        description: Existing release tag to publish when dry_run is false, for example mcp-server-v0.5.0.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-mcp-server-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "v1.8.0"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages--tag_name'] }}
      version: ${{ steps.release.outputs['packages--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs:
      - release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check npm publication state
        id: npm-state
        run: node scripts/ci/verify-mcp-publication.mjs npm --allow-missing

      - name: Publish ${{ needs.release-please.outputs.tag_name }} to npm
        if: ${{ steps.npm-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: npm publish -w @astandrik/local-ydb-mcp

      - name: Verify npm publication
        run: node scripts/ci/verify-mcp-publication.mjs npm --wait-seconds 300

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate

      - name: Check MCP Registry publication state
        id: registry-state
        run: node scripts/ci/verify-mcp-publication.mjs registry --allow-missing

      - name: Publish ${{ needs.release-please.outputs.tag_name }} to MCP Registry
        if: ${{ steps.registry-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify MCP Registry publication
        run: node scripts/ci/verify-mcp-publication.mjs registry --wait-seconds 300

  post-release-plugin-pin:
    if: >-
      always() &&
      (
        (
          needs.release-please.outputs.release_created == 'true' &&
          needs.publish.result == 'success'
        ) ||
        needs.publish-existing-release.result == 'success'
      )
    needs:
      - release-please
      - publish
      - publish-existing-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate published MCP and update plugin pin
        id: publication
        env:
          RELEASE_TAG: ${{ needs.publish-existing-release.outputs.tag_name || needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.publish-existing-release.outputs.version || needs.release-please.outputs.version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release version output must use stable X.Y.Z semver" >&2
            exit 1
          fi
          if [ "${RELEASE_TAG}" != "mcp-server-v${RELEASE_VERSION}" ]; then
            echo "release tag output does not match version ${RELEASE_VERSION}" >&2
            exit 1
          fi

          node scripts/ci/update-agent-plugin-pin.mjs --mcp-version "${RELEASE_VERSION}" --write
          node scripts/ci/check-agent-plugin-freshness.mjs
          node --test \
            scripts/ci/update-agent-plugin-pin.test.mjs \
            scripts/ci/check-agent-plugin-freshness.test.mjs \
            scripts/ci/agent-plugin-workflow.test.mjs \
            scripts/ci/post-release-plugin-pin.test.mjs

          echo "mcp_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Disable Git hooks
        run: git config --local core.hooksPath /dev/null

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          base: main
          branch: codex/update-plugin-mcp-pin-v${{ steps.publication.outputs.mcp_version }}
          commit-message: "chore(plugin): pin published MCP ${{ steps.publication.outputs.mcp_version }}"
          title: "chore(plugin): pin published MCP ${{ steps.publication.outputs.mcp_version }}"
          draft: always-true
          delete-branch: false
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            .mcp.json
            README.md
            docs/openai-plugin-submission.md
            gemini-extension.json
            mcp.json
            plugin.json
          body: |
            This draft was created after the MCP release was published and read back.

            Publication evidence:
            - GitHub release output: `mcp-server-v${{ steps.publication.outputs.mcp_version }}`
            - npm latest readback: `@astandrik/local-ydb-mcp@${{ steps.publication.outputs.mcp_version }}`
            - MCP Registry readback: `io.github.astandrik/local-ydb-mcp@${{ steps.publication.outputs.mcp_version }}` with npm package `@astandrik/local-ydb-mcp@${{ steps.publication.outputs.mcp_version }}`

            Automated checks before proposal: exact npm/MCP Registry freshness readback and focused updater/freshness/workflow contracts. Full build, package, published MCP smoke, and live integration run in this PR's CI.

            Manual Cursor Directory follow-up:
            - [ ] Merge this draft PR only after review.
            - [ ] Update the Cursor Directory entry only after merge.
            - [ ] Confirm the Cursor command pins `@astandrik/local-ydb-mcp@${{ steps.publication.outputs.mcp_version }}`.
            - [ ] Submit the Cursor Directory entry for rescan.

  publish-existing-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/publish-mcp-server.yml@refs/heads/main', github.repository) &&
      inputs.dry_run == false &&
      inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.publish_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Verify published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/${PUBLISH_TAG}" || {
            echo "publish_tag must identify an existing tag: ${PUBLISH_TAG}" >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo "publish_tag must point to a commit contained in the main branch" >&2
            exit 1
          }
          if ! release_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${PUBLISH_TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')"; then
            echo "publish_tag must identify a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          if [ "${release_tag}" != "${PUBLISH_TAG}" ]; then
            echo "publish_tag must identify a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          package_version="$(node -p "require('./packages/mcp-server/package.json').version")"
          expected_tag="mcp-server-v${package_version}"
          if [ "${PUBLISH_TAG}" != "${expected_tag}" ]; then
            echo "publish_tag must match package version: expected ${expected_tag}, got ${PUBLISH_TAG}" >&2
            exit 1
          fi
          echo "tag_name=${PUBLISH_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check npm publication state
        id: npm-state
        run: node scripts/ci/verify-mcp-publication.mjs npm --allow-missing

      - name: Publish ${{ inputs.publish_tag }} to npm
        if: ${{ steps.npm-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: npm publish -w @astandrik/local-ydb-mcp

      - name: Verify npm publication
        run: node scripts/ci/verify-mcp-publication.mjs npm --wait-seconds 300

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate

      - name: Check MCP Registry publication state
        id: registry-state
        run: node scripts/ci/verify-mcp-publication.mjs registry --allow-missing

      - name: Publish ${{ inputs.publish_tag }} to MCP Registry
        if: ${{ steps.registry-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify MCP Registry publication
        run: node scripts/ci/verify-mcp-publication.mjs registry --wait-seconds 300

  dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate
