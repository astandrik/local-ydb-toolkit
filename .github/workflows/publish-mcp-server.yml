name: Release MCP server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run build, tests, typecheck, and npm package dry-run.
        required: false
        default: true
        type: boolean
      publish_tag:
        description: Existing release tag to publish when dry_run is false, for example mcp-server-v0.5.0.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-mcp-server-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "v1.8.0"
  MCP_PUBLISHER_LINUX_AMD64_SHA256: "1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf"

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages--tag_name'] }}
      version: ${{ steps.release.outputs['packages--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    needs:
      - release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check npm publication state
        id: npm-state
        run: node scripts/ci/verify-mcp-publication.mjs npm --allow-missing

      - name: Publish ${{ needs.release-please.outputs.tag_name }} to npm
        if: ${{ steps.npm-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: npm publish -w @astandrik/local-ydb-mcp

      - name: Verify npm publication
        run: node scripts/ci/verify-mcp-publication.mjs npm --wait-seconds 300

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate

      - name: Check MCP Registry publication state
        id: registry-state
        run: node scripts/ci/verify-mcp-publication.mjs registry --allow-missing

      - name: Publish ${{ needs.release-please.outputs.tag_name }} to MCP Registry
        if: ${{ steps.registry-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify MCP Registry publication
        run: node scripts/ci/verify-mcp-publication.mjs registry --wait-seconds 300

  post-release-plugin-pin:
    if: >-
      needs.release-please.outputs.release_created == 'true' &&
      needs.publish.result == 'success'
    needs:
      - release-please
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Revalidate published MCP metadata
        id: publication
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import {
            assertStableSemver,
            checkAgentPluginFreshness,
            loadFreshnessInputs,
            npmPackageFromServer,
          } from "./scripts/ci/check-agent-plugin-freshness.mjs";

          const version = process.env.RELEASE_VERSION;
          const tag = process.env.RELEASE_TAG;
          assertStableSemver(version, "release-please version output");
          if (tag !== `mcp-server-v${version}`) {
            throw new Error(`release-please tag output does not match version ${version}`);
          }

          const inputs = await loadFreshnessInputs();
          if (inputs.server.version !== version) {
            throw new Error(`server.json version ${inputs.server.version} does not match release ${version}`);
          }
          if (inputs.server.name !== "io.github.astandrik/local-ydb-mcp") {
            throw new Error("server.json contains the wrong MCP Registry identity");
          }
          const npmPackage = npmPackageFromServer(inputs.server);
          if (npmPackage.identifier !== "@astandrik/local-ydb-mcp") {
            throw new Error("server.json contains the wrong npm package identity");
          }

          const publishedPlugin = structuredClone(inputs.plugin);
          if (!Array.isArray(publishedPlugin?.mcpServers?.["local-ydb"]?.args)) {
            throw new Error("mcp.json does not contain the expected local-ydb MCP entry");
          }
          publishedPlugin.mcpServers["local-ydb"].args[1] = `${npmPackage.identifier}@${version}`;
          await checkAgentPluginFreshness({
            server: inputs.server,
            plugin: publishedPlugin,
          });

          const output = process.env.GITHUB_OUTPUT;
          if (!output) {
            throw new Error("GITHUB_OUTPUT is required");
          }
          await appendFile(
            output,
            [
              `mcp_version=${version}`,
              `npm_package=${npmPackage.identifier}@${version}`,
              `registry_server=${inputs.server.name}@${version}`,
              "",
            ].join("\n"),
            "utf8",
          );
          NODE

      - run: npm ci

      - name: Update Agent Plugin MCP pin
        id: pin
        env:
          MCP_VERSION: ${{ steps.publication.outputs.mcp_version }}
        run: |
          npm run plugin:pin -- --mcp-version "${MCP_VERSION}" --write
          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run focused Agent Plugin contracts
        run: node --test scripts/ci/update-agent-plugin-pin.test.mjs scripts/ci/check-agent-plugin-freshness.test.mjs scripts/ci/post-release-plugin-pin.test.mjs

      - run: npm run build

      - run: npm run plugin:freshness

      - run: npm run plugin:package

      - run: npm run plugin:smoke

      - name: Push plugin pin branch and open draft PR
        if: ${{ steps.pin.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          MCP_VERSION: ${{ steps.publication.outputs.mcp_version }}
          NPM_PACKAGE: ${{ steps.publication.outputs.npm_package }}
          REGISTRY_NPM_PACKAGE: ${{ steps.publication.outputs.npm_package }}
          REGISTRY_SERVER: ${{ steps.publication.outputs.registry_server }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "${MCP_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "MCP_VERSION must use a stable X.Y.Z semver" >&2
            exit 1
          fi

          branch="codex/update-plugin-mcp-pin-v${MCP_VERSION}"
          title="chore(plugin): pin published MCP ${MCP_VERSION}"
          expected_files=(
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            .mcp.json
            README.md
            docs/openai-plugin-submission.md
            gemini-extension.json
            mcp.json
            plugin.json
          )
          changed_files="$(git diff --name-only)"
          EXPECTED_FILES="$(printf '%s\n' "${expected_files[@]}")" CHANGED_FILES="${changed_files}" \
            node --input-type=module <<'NODE'
          const expected = process.env.EXPECTED_FILES.split("\n").filter(Boolean).sort();
          const changed = process.env.CHANGED_FILES.split("\n").filter(Boolean).sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) {
            throw new Error(`Refusing to publish unexpected changed files: ${JSON.stringify(changed)}`);
          }
          NODE

          gh auth setup-git --hostname github.com
          encoded_branch="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "${branch}")"
          branch_exists=false
          branch_error="${RUNNER_TEMP}/plugin-pin-branch-error"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_branch}" >/dev/null 2>"${branch_error}"; then
            branch_exists=true
          elif ! grep -q '(HTTP 404)' "${branch_error}"; then
            cat "${branch_error}" >&2
            exit 1
          fi

          pull_requests_json="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${branch}" \
            --state all \
            --limit 10 \
            --json url,state,isDraft,mergedAt,title,headRefName,baseRefName,body)"
          state="$(
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            MCP_VERSION="${MCP_VERSION}" \
            BRANCH_EXISTS="${branch_exists}" \
            PULL_REQUESTS_JSON="${pull_requests_json}" \
              node scripts/ci/post-release-plugin-pin.mjs
          )"
          action="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).action)' "${state}")"

          if [ "${action}" = "return" ]; then
            existing_url="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).url)' "${state}")"
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git merge-base --is-ancestor HEAD "refs/remotes/origin/${branch}" || {
              echo "Existing draft PR branch is not based on the current main commit" >&2
              exit 1
            }
            git diff --binary --full-index HEAD > "${RUNNER_TEMP}/expected-plugin-pin.patch"
            git diff --binary --full-index HEAD "refs/remotes/origin/${branch}" > "${RUNNER_TEMP}/existing-plugin-pin.patch"
            cmp "${RUNNER_TEMP}/expected-plugin-pin.patch" "${RUNNER_TEMP}/existing-plugin-pin.patch" || {
              echo "Existing draft PR does not contain the exact expected plugin pin update" >&2
              exit 1
            }
            echo "Existing draft PR: ${existing_url}"
            exit 0
          fi
          if [ "${action}" != "create" ]; then
            echo "Unexpected pull request action: ${action}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add -- "${expected_files[@]}"
          git commit -m "${title}"
          git push --set-upstream origin "${branch}"

          body_file="${RUNNER_TEMP}/plugin-pin-pr-body.md"
          {
            echo "This draft was created after the MCP release was published and read back."
            echo
            echo "Publication evidence:"
            echo "- GitHub release output: ${RELEASE_TAG}"
            echo "- npm latest readback: ${NPM_PACKAGE}"
            echo "- MCP Registry readback: ${REGISTRY_SERVER}; npm package ${REGISTRY_NPM_PACKAGE}"
            echo
            echo "Automated checks: focused updater/freshness/workflow contracts, package build, plugin package, freshness readback, and published MCP smoke."
            echo
            echo "Manual Cursor Directory follow-up:"
            echo "- [ ] Merge this draft PR only after review."
            echo "- [ ] Update the Cursor Directory entry only after merge."
            echo "- [ ] Confirm the Cursor command pins ${NPM_PACKAGE}."
            echo "- [ ] Submit the Cursor Directory entry for rescan."
          } > "${body_file}"

          pr_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${branch}" \
            --title "${title}" \
            --body-file "${body_file}" \
            --draft)"
          created_pr_json="$(gh pr view \
            --repo "${GITHUB_REPOSITORY}" \
            "${pr_url}" \
            --json url,state,isDraft,mergedAt,title,headRefName,baseRefName,body)"
          readback_state="$(
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
            MCP_VERSION="${MCP_VERSION}" \
            BRANCH_EXISTS=true \
            PULL_REQUESTS_JSON="[${created_pr_json}]" \
              node scripts/ci/post-release-plugin-pin.mjs
          )"
          readback_url="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).url)' "${readback_state}")"
          if [ "${readback_url}" != "${pr_url}" ]; then
            echo "Draft PR readback URL mismatch" >&2
            exit 1
          fi
          echo "Created draft PR: ${pr_url}"

  publish-existing-release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/.github/workflows/publish-mcp-server.yml@refs/heads/main', github.repository) &&
      inputs.dry_run == false &&
      inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.publish_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Verify published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/${PUBLISH_TAG}" || {
            echo "publish_tag must identify an existing tag: ${PUBLISH_TAG}" >&2
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo "publish_tag must point to a commit contained in the main branch" >&2
            exit 1
          }
          if ! release_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${PUBLISH_TAG}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')"; then
            echo "publish_tag must identify a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          if [ "${release_tag}" != "${PUBLISH_TAG}" ]; then
            echo "publish_tag must identify a published, non-prerelease GitHub release" >&2
            exit 1
          fi
          package_version="$(node -p "require('./packages/mcp-server/package.json').version")"
          expected_tag="mcp-server-v${package_version}"
          if [ "${PUBLISH_TAG}" != "${expected_tag}" ]; then
            echo "publish_tag must match package version: expected ${expected_tag}, got ${PUBLISH_TAG}" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Check npm publication state
        id: npm-state
        run: node scripts/ci/verify-mcp-publication.mjs npm --allow-missing

      - name: Publish ${{ inputs.publish_tag }} to npm
        if: ${{ steps.npm-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: npm publish -w @astandrik/local-ydb-mcp

      - name: Verify npm publication
        run: node scripts/ci/verify-mcp-publication.mjs npm --wait-seconds 300

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate

      - name: Check MCP Registry publication state
        id: registry-state
        run: node scripts/ci/verify-mcp-publication.mjs registry --allow-missing

      - name: Publish ${{ inputs.publish_tag }} to MCP Registry
        if: ${{ steps.registry-state.outputs.exists != 'true' }}
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Verify MCP Registry publication
        run: node scripts/ci/verify-mcp-publication.mjs registry --wait-seconds 300

  dry-run:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.publish_tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

      - run: npm run typecheck

      - run: npm pack -w @astandrik/local-ydb-mcp --dry-run

      - name: Install verified mcp-publisher
        run: |
          archive="${RUNNER_TEMP}/mcp-publisher.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/mcp-publisher"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate MCP Registry metadata
        run: mcp-publisher validate
