name: Agent Plugin published MCP smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-plugin-smoke.yml"
      - ".codex-plugin/**"
      - ".claude-plugin/plugin.json"
      - ".mcp.json"
      - "mcp.json"
      - "gemini-extension.json"
      - "package-lock.json"
      - "package.json"
      - "packages/*/package.json"
      - "plugin.json"
      - "server.json"
      - "scripts/ci/*plugin*.mjs"
      - "scripts/package-agent-plugin.mjs"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/agent-plugin-smoke.yml"
      - ".codex-plugin/**"
      - ".claude-plugin/plugin.json"
      - ".mcp.json"
      - "mcp.json"
      - "gemini-extension.json"
      - "package-lock.json"
      - "package.json"
      - "packages/*/package.json"
      - "plugin.json"
      - "server.json"
      - "scripts/ci/*plugin*.mjs"
      - "scripts/package-agent-plugin.mjs"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: agent-plugin-published-mcp-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-freshness:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm run plugin:freshness

  published-mcp-smoke:
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: node --test scripts/ci/*plugin*.test.mjs

      - run: npm run plugin:smoke
